[project]
name = "carbon_frappe"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Carbon Design System theme for Frappe"
# frappe v16 is `>=3.14,<3.15`; ty derives its target from this line
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]

# ---------------------------------------------------------------------------
# ruff — frappe's rule set (F E W I UP B RUF, tabs, 110 columns) at our strictest
# app's level (only E501 and W191 ignored: the formatter owns line length and
# frappe's indentation is tabs), plus the simplification/perf families and
# T20 (no stray prints). The tools themselves are pinned in tools/pyproject.toml.
[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = [
	"E501", # line too long — the formatter decides
	"W191", # indentation contains tabs — frappe's convention
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

# ---------------------------------------------------------------------------
# ty — checked against the frappe-nix bench's interpreter, where `frappe` is
# installed: `ty check --python "$FRAPPE_BENCH_ROOT/env"`. Never through a bare
# `uv run`, which exports its own VIRTUAL_ENV and ty honours that first.
[tool.ty.src]
include = ["carbon_frappe"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
# flow.*: the AI-chat client calls the flow app's API, which this bench doesn't carry
whitelist = ["frappe.*", "erpnext.*", "hrms.*", "flow.*"]

# ---------------------------------------------------------------------------
# frappe-nix app standards. The managed files (flake.nix, .envrc, the tool
# configs, the git hooks) are rendered from Avunu's profile plus this table by
# `frappe-init --sync`; `frappe-nix sync --check` reports drift.
[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
# not runtime requirements (hooks.py declares none): the browser suites'
# fixtures live in ERPNext's Projects and HRMS's Recruitment sidebars, so the
# dev and CI benches carry both, erpnext first
siblings = ["erpnext", "hrms"]
site = "carbon.localhost"
# patch-assets, the audits and the AI-chat bundle are a real build step
build = true
# `yarn codegen` output; its freshness is checked by `ci:typecheck` (ci / typecheck).
# Kept out of the formatters, linters and validate_copyright (the icon data is
# IBM's, under Apache-2.0); the .ts modules are still type-checked. The codegen
# formats its own output (scripts/lib/format.ts).
generated = [
	"carbon_frappe/public/js/generated/**",
	"carbon_frappe/public/scss/generated/**",
	"carbon_frappe/public/fonts/**",
]
# The committed nix/ locks are what relock produces: run by `ci / test`
# (frappe-test --ci, shell checks), which fails if it changes anything, so a
# dependency change without its relock fails the PR instead of a later build.
shell-checks = ["nix run .#relock --no-pure-eval"]
# the browser suites, against the site nightly's integration job brings up
nightly-suites = ["node scripts/test-tables.ts", "node scripts/test-shell.ts"]
# scripts/ci-typecheck.sh compiles the theme against frappe's sources, whose sass
# pipeline resolves `~frappe-charts` and friends from frappe's own node_modules
frappe-node-modules = true

[tool.frappe-nix.dev-shell]
frappe-nix-url = "github:Avunu/frappe-nix/de60612a38409a61004f3d311a9e2748d2a3d341"

[tool.frappe-nix.releases]
bootstrap-sha = "3c33bb4b9f57d49bf200a3dc1ec54138c55faa82"

[tool.frappe-nix.typescript]
# the default, plus the standalone table demo (`yarn dev:table`)
browser-include = [
	"carbon_frappe/public/js/**/*.ts",
	"carbon_frappe/public/js/**/*.d.ts",
	"types/**/*.d.ts",
	"dev/**/*.ts",
]
# Two @carbon/ai-chat-components entry points can't be typechecked with
# `skipLibCheck: false`, and neither can be fixed from here: markdown/index.js's
# declarations import names upstream's `stripInternal` removed, and
# feedback/index.js reaches @carbon/web-components' text-input.d.ts, whose
# `set value(v: string): any;` is TS1095. Both are imported only for their
# registration side effect, so the checker sees an empty module; the elements'
# typed surface is ai_chat/elements.ts. esbuild never reads these paths
# (scripts/build-ai-chat.ts passes it no tsconfig).
paths = { "@carbon/ai-chat-components/es/components/markdown/index.js" = [
	"./carbon_frappe/public/js/ai_chat/shims/empty-module.d.ts",
], "@carbon/ai-chat-components/es/components/feedback/index.js" = [
	"./carbon_frappe/public/js/ai_chat/shims/empty-module.d.ts",
] }

[tool.frappe-nix.js.oxlint]
overrides = [
	# side-effect-only imports: the ai-chat element registration and its entry
	{ files = [
		"carbon_frappe/public/js/ai_chat/register.ts",
		"carbon_frappe/public/js/ai_chat/entry.ts",
	], rules = { "import/no-unassigned-import" = "off" } },
	# the standalone table demo runs in a browser page and logs to it
	{ files = [
		"dev/**",
	], rules = { "no-console" = "off", "no-await-in-loop" = "off" } },
]
