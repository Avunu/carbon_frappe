version: 2

# Dependency autopilot: every entry is meant to merge without a human
# (.github/workflows/dependabot-auto-merge.yml), gated by the checks required
# on `develop`. Bumps carry the `chore` type so they never cut a release on
# their own. All four ecosystems target `develop`; `version-16` only ever
# receives release commits.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 3

  # @carbon/*, tanstack, sass, frappe-types, the formatter and linters.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 3

  # ruff, ty, zizmor, committed, actionlint, semgrep, prek — tools/uv.lock.
  - package-ecosystem: "uv"
    directory: "/tools"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    groups:
      tools:
        patterns: ["*"]
    cooldown:
      default-days: 3

  # Flake inputs: frappe-nix, and frappe/erpnext/hrms themselves — a weekly
  # "the framework moved; does the theme still hold?" pull request, answered
  # by `nix build`, the audits and the integration suites. A frappe bump can
  # legitimately fail the drift audits and need a follow-up commit; auto-merge
  # simply waits. `nix run .#relock` may be needed when a bump changes Python
  # dependencies (the shell says so), and `nix run .#relock -- --node-locks
  # frappe/ui erpnext/banking hrms/frontend hrms/roster` when one of the nested
  # frontends' upstream yarn.lock is stale against its package.json — the
  # forced fallback locks under nix/node-locks/ exist for exactly that.
  - package-ecosystem: "nix"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    # frappe-nix is pinned in [tool.frappe-nix.dev-shell] and the profile moves
    # only with `nix flake update standards-profile && nix run .#frappe-init -- --sync`:
    # either can rewrite managed files, so neither moves without a reviewed sync
    ignore:
      - dependency-name: "frappe-nix"
      - dependency-name: "standards-profile"
    groups:
      flake-inputs:
        patterns: ["*"]
    cooldown:
      default-days: 3
