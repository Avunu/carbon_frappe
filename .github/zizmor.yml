# zizmor — static analysis of the workflows. Third-party actions must be
# hash-pinned (dependabot keeps the hashes moving); GitHub's own may ride a
# major tag.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        "*": hash-pin
  # The profile's dependabot cooldown (dependabot.cooldown-days) is 3 days.
  dependabot-cooldown:
    config:
      days: 3
