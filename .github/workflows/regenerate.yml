name: regenerate

# Repairs the codegen output where it drifted. `ci / typecheck` fails when
# `yarn codegen` would change a committed file (scripts/ci-typecheck.sh); this
# job runs it and commits the result back to the branch, so a branch that only
# needs regenerating (an @carbon/icons or @ibm/plex bump, say) goes green
# without a human re-running codegen.
#
# Only the codegen: the nix/ locks belong to the managed deps.yml, whose
# relock job regenerates them on Dependabot's flake bumps.
#
# Runs on pull requests from branches in this repository (fork pull requests
# get no write token and are skipped) and on pushes to develop.
#
# Pushes made with GITHUB_TOKEN start no new workflow runs, so a commit this
# job lands does not re-run the checks by itself. Set the REGEN_TOKEN secret to
# a token with contents:write (a PAT or GitHub App token), and add the same
# value as a Dependabot secret so Dependabot's PRs can be repaired. With it, the
# commit re-runs the checks, and the next run finds nothing to change and stops.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: regenerate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  regenerate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The GITHUB_TOKEN fallback pushes, so it needs write; with REGEN_TOKEN set
    # this is unused. A Dependabot run's token stays read-only without it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: yarn install --frozen-lockfile --non-interactive

      # The token is not in the environment of this step: the head branch's own
      # scripts run here.
      - name: Regenerate the codegen output
        run: yarn codegen

      - name: Commit and push what changed
        env:
          REGEN_TOKEN: ${{ secrets.REGEN_TOKEN }}
          TOKEN: ${{ secrets.REGEN_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$REGEN_TOKEN" ]; then
            echo "::warning::REGEN_TOKEN is not set; the commit will not re-run the checks"
          fi
          git add -A -- carbon_frappe/public/js/generated carbon_frappe/public/scss/generated \
            carbon_frappe/public/fonts
          if git diff --cached --quiet; then
            echo "Generated output is current; nothing to commit."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(codegen): regenerate generated files"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/$BRANCH"
