name: check

# CI gate for this repo. Auto-merge is only as safe as what runs here, so this is what
# you mark required on `version-16`.
#
# This gate is weaker than the other apps' by necessity. `yarn build` runs the three
# scripts with --warn-only, and both audit-tokens.ts and dev-compile.ts resolve a
# frappe checkout (FRAPPE_PATH or ../frappe) that CI does not have — audit-tokens exits
# early without it. So this catches what a dependency bump most often breaks (a module
# that no longer resolves, or a @carbon/sass API that changed under the scripts) but it
# does not run the strict token/markup audits.
#
# To make it a real gate, check out frappe/frappe at the matching branch and run
# `yarn audit` with FRAPPE_PATH pointed at it.

on:
  push:
    branches: [version-16]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Type-checks BOTH projects (browser bundles + node scripts) against
      # frappe-types. Cheap, needs no frappe checkout, and catches the whole
      # class of breakage the audits below cannot see.
      - run: yarn typecheck

      - run: yarn build
