name: check

# The gate. Job names are the required checks on `develop`:
#
#   lint         every linter and formatter, through prek — the same command a
#                developer runs — plus the commit subjects, semgrep, and the
#                tools lock
#   typecheck    tsc, the unit tests, codegen freshness, and the drift audits
#                against frappe at the revision flake.lock pins (checked out
#                with git, so this job needs no nix)
#   bench        the app compiled in a clean bench (`nix build`), `nix fmt`,
#                statix/deadnix, and ty against the bench's interpreter
#   integration  the site-backed suites — bench run-tests and the two browser
#                suites — on push, nightly and on demand. Not per pull request:
#                a whole bench closure through the Actions cache is a
#                once-a-day cost, not a per-commit one.
#
# and one alarm:
#
#   version-16   `version-16` only ever receives release commits, written by
#                release-please.yml with GITHUB_TOKEN — whose pushes raise no
#                workflow runs. So a `push` run on that branch IS a human push,
#                and this fails unless the branch head is the newest v* tag.
#
# Third-party actions are hash-pinned (zizmor.yml); dependabot moves the hashes.

on:
  push:
    branches: [develop, version-16]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    if: github.ref != 'refs/heads/version-16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: yarn
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: yarn install --frozen-lockfile
      - run: uv sync --frozen --project tools
      - name: The tools lock is current
        run: uv lock --check --project tools

      # Everything in .pre-commit-config.yaml, over the whole tree.
      - run: uv run --frozen --project tools prek run --all-files --show-diff-on-failure

      # Conventional commits: every commit a pull request brings, and its title
      # (the squash-merge subject release-please will read).
      - name: Commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          uv run --frozen --project tools committed "$BASE_SHA..HEAD" --no-merge-commit
          node scripts/check-commit-subject.ts --subject "$PR_TITLE"
          uv run --frozen --project tools committed --commit-file <(printf '%s\n' "$PR_TITLE")

      # frappe's own rule set, the way its Linters workflow runs it, plus
      # erpnext's rules for test files.
      - name: Semgrep (frappe/semgrep-rules)
        run: |
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules
          uv run --frozen --project tools semgrep scan --error --config /tmp/frappe-semgrep-rules/rules --config r/python.lang.correctness carbon_frappe
          uv run --frozen --project tools semgrep scan --error --include='**/test_*.py' --config semgrep/test-correctness.yml carbon_frappe

  typecheck:
    if: github.ref != 'refs/heads/version-16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn check:major
      - name: Unit tests
        run: |
          test "$(find test/unit -name '*.test.ts' | wc -l)" -gt 0 || { echo "::error::no unit tests found"; exit 1; }
          yarn test:unit
      - name: Generated files are current
        run: |
          yarn codegen
          git diff --exit-code -- carbon_frappe/public/js/generated carbon_frappe/public/scss/generated carbon_frappe/public/fonts

      # The audits and the standalone SCSS compile compare this theme against
      # frappe's source. The same tree nix pins, without nix: flake.lock names
      # the revision.
      - name: Check out frappe at the pinned revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev="$(jq -r '.nodes.frappe.locked.rev' flake.lock)"
          git clone --filter=blob:none --no-checkout https://github.com/frappe/frappe.git ../frappe
          git -C ../frappe checkout --quiet "$rev"
          echo "FRAPPE_PATH=$(cd ../frappe && pwd)" >> "$GITHUB_ENV"
      # frappe's sass pipeline resolves `~frappe-charts` and friends from
      # frappe's OWN node_modules, which a bare checkout does not have.
      - name: Install frappe's node_modules
        run: yarn --cwd ../frappe install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn compile
      - run: yarn audit

  bench:
    if: github.ref != 'refs/heads/version-16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: nix fmt, statix, deadnix
        run: |
          nix fmt -- --check flake.nix
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail .
      # Not `nix flake check`: devenv's flake module publishes container
      # outputs whose evaluation demands an input this flake does not (and
      # should not) carry. The two outputs that matter are built/entered below.
      # The app compiled in a clean bench: frappe + erpnext + hrms + this, with
      # `bench build` run over all of them.
      - name: nix build
        run: nix build .#default -L --no-pure-eval
      - name: ty, against the bench's interpreter
        run: nix develop --no-pure-eval -c yarn -s typecheck:py

  integration:
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/version-16'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - run: nix develop --no-pure-eval -c bash ci/integration.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: .dev-dist/screenshots/
          if-no-files-found: ignore

  version-16:
    if: github.ref == 'refs/heads/version-16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The branch head is the newest release
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          head="$(git rev-parse HEAD)"
          if [ -z "$latest" ] || [ "$(git rev-parse "$latest^{commit}")" != "$head" ]; then
            echo "::error::version-16 is at $head but the newest release is ${latest:-none}. Only release-please.yml pushes here."
            exit 1
          fi
          echo "version-16 = $latest"
