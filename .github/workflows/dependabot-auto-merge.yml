name: dependabot auto-merge

# Turns on auto-merge for Dependabot pull requests; GitHub then merges each
# once it is mergeable and the checks required on `develop` are green — so
# this gates only as far as `lint`, `typecheck` and `bench` are required
# checks (Step 0 of the CI plan; they are).
#
# Merging releases nothing: bumps carry the `chore` type (.github/dependabot.yml)
# and release-please only bumps on `fix:`/`feat:`.
#
# The actor check reads the pull request's author, not `github.actor`, which
# a re-run by a human would set to that human (zizmor: bot-conditions).

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Squash: one mechanical commit, titled with Dependabot's `chore(...)`
      # subject, which is what release-please reads and declines to release on.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
