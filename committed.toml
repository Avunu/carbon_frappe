# Conventional commits (https://www.conventionalcommits.org/), with frappe's
# commitlint type set. Subjects are the changelog and choose the version:
# `fix:` → patch, `feat:` → minor. There is deliberately no way to bump the
# major: it is the frappe major (see scripts/check-frappe-major.ts), so
# `feat!:` and `BREAKING CHANGE:` are refused by scripts/check-commit-subject.ts.
style = "conventional"
allowed_types = [
	"build",
	"chore",
	"ci",
	"docs",
	"feat",
	"fix",
	"perf",
	"refactor",
	"revert",
	"style",
	"test",
	"deprecate",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
